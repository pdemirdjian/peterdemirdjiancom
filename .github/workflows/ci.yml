name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Hugo version from netlify.toml
        run: |
          HUGO_VERSION=$(grep 'HUGO_VERSION' netlify.toml | cut -d'"' -f2)
          echo "HUGO_VERSION=${HUGO_VERSION}" >> $GITHUB_ENV

      - name: Install Hugo
        run: |
          wget -q -O hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          rm hugo.deb
          hugo version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium system dependencies for the resume PDF
        run: pnpm exec playwright install-deps chromium

      - name: Build website and resume PDF
        run: pnpm build

      - name: Cache build for integration tests
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/
          key: build-${{ github.sha }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-build
          path: public/
          retention-days: 7

  visual:
    name: Visual Regression
    needs: lint-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Baselines are generated and compared in this image only, so font
    # rendering never differs between runs. Its tag MUST match the
    # @playwright/test version in package.json (Renovate groups the two);
    # the "Check Playwright image" step fails when they drift. Keep the tag in
    # sync in update-visual-baselines.yml and the README docker command too.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      # actions/cache compresses with zstd when the tool is present; the
      # build cache was saved on the runner with zstd, so restoring it needs
      # the same compression.
      - name: Install zstd for the build cache
        run: command -v zstd || (apt-get update && apt-get install -y --no-install-recommends zstd)

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Playwright image matches @playwright/test
        run: |
          expected="mcr.microsoft.com/playwright:v$(node -p "require('./package.json').devDependencies['@playwright/test']")-noble"
          found=$(grep -rhoE 'mcr\.microsoft\.com/playwright:v[0-9.]+-noble' .github/workflows | sort -u)
          if [ "$found" != "$expected" ]; then
            echo "::error::Playwright image tags in .github/workflows ($found) must all be $expected"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Restore cached build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/
          key: build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run visual regression tests
        # The `visual` project is only defined when this is set.
        env:
          PLAYWRIGHT_VISUAL: '1'
        run: pnpm exec playwright test --project=visual

      # -actual/-diff PNGs land in test-results/; a missing baseline is
      # written into the snapshot directory, so both are uploaded.
      - name: Upload screenshots and diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression
          path: |
            test-results/
            tests/visual.spec.ts-snapshots/
          retention-days: 7

  integration-tests:
    name: Integration Tests (${{ matrix.browser }})
    needs: lint-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `deploy` and `build` are not browsers: they are the browserless
        # projects that exercise the deploy contract against the Netlify
        # emulator and verify the build output.
        browser: [chromium, firefox, webkit, deploy, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Restore cached build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/
          key: build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm list @playwright/test --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ !contains(fromJSON('["deploy", "build"]'), matrix.browser) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: ${{ !contains(fromJSON('["deploy", "build"]'), matrix.browser) && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install ${{ matrix.browser }}

      - name: Install Playwright system dependencies
        if: ${{ !contains(fromJSON('["deploy", "build"]'), matrix.browser) }}
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
