name: Update visual baselines

# Regenerates the `visual` project's baselines in the same Playwright image the
# CI `visual` job compares in, and uploads them as an artifact for a human to
# review and commit to tests/visual.spec.ts-snapshots/.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Tag MUST match @playwright/test in package.json and the CI `visual` job;
    # the "Check Playwright image" step fails when they drift.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      # git lets Hugo read lastmod from history (enableGitInfo).
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history so Hugo's Lastmod comes from Git (enableGitInfo), as
        # on Netlify, rather than the checkout time.
        with:
          fetch-depth: 0

      # The container runs as root but the workspace is owned by the runner
      # user, so git refuses it ("dubious ownership") and Hugo's GitInfo fails.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Playwright image matches @playwright/test
        run: |
          expected="mcr.microsoft.com/playwright:v$(node -p "require('./package.json').devDependencies['@playwright/test']")-noble"
          found=$(grep -rhoE 'mcr\.microsoft\.com/playwright:v[0-9.]+-noble' .github/workflows | sort -u)
          if [ "$found" != "$expected" ]; then
            echo "::error::Playwright image tags in .github/workflows ($found) must all be $expected"
            exit 1
          fi

      - name: Install Hugo
        run: |
          HUGO_VERSION=$(grep 'HUGO_VERSION' netlify.toml | cut -d'"' -f2)
          curl -fsSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          dpkg -i hugo.deb
          rm hugo.deb
          hugo version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build website and resume PDF
        run: pnpm build

      - name: Regenerate baselines
        run: pnpm exec playwright test --project=visual --update-snapshots=all

      - name: Upload baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/visual.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 7
