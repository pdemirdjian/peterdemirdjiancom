<header>
  <nav>
    <a href="/" class="site-title">{{ .Site.Title }}</a>
    <ul>
      {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL }}"{{ if hasPrefix .URL "http" }} rel="noopener" target="_blank"{{ end }}>{{ .Name }}</a>
      </li>
      {{ end }}
      {{ $person := .Site.Params.person }}
      <li>
        <a href="{{ $person.linkedin }}" rel="noopener" target="_blank">LinkedIn</a>
      </li>
      <li>
        <a href="{{ $person.github }}" rel="noopener" target="_blank">GitHub</a>
      </li>
      <li>
        <a href="mailto:{{ $person.email }}">Email</a>
      </li>
      <li>
        <button id="theme-toggle" aria-label="Toggle dark mode">☀</button>
      </li>
    </ul>
  </nav>
</header>
