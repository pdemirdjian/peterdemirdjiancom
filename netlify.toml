# Netlify Build Configuration

[build]
  publish = "public"
  # Hugo's :git lastmod needs real history: in a shallow clone every page gets
  # the build commit's date (PDE-253), so deepen first when Netlify cloned shallow.
  command = "if [ \"$(git rev-parse --is-shallow-repository)\" = true ]; then git fetch --unshallow --quiet; fi && pnpm build"

[build.environment]
  HUGO_VERSION = "0.169.0"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    # OWASP recommends disabling the deprecated XSS auditor; CSP provides XSS protection.
    X-XSS-Protection = "0"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), xr-spatial-tracking=(), accelerometer=(), gyroscope=(), magnetometer=(), clipboard-read=(), clipboard-write=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache fonts with longer TTL — filenames are stable (no fingerprinting)
[[headers]]
  for = "/fonts/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache Control for static assets
# Hugo outputs CSS to /css/, images to /images/ — root-only globs (/*.css) miss subdirectory paths
# immutable omitted: Hugo does not fingerprint static filenames
[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# HTML files - short cache so deploys propagate quickly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Resume PDF - readable filename when saved; short cache so deploys propagate
[[headers]]
  for = "/resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Disposition = "inline; filename=\"Peter-Demirdjian-Resume.pdf\""

# Force HTTPS redirects
[[redirects]]
  from = "http://peterdemirdjian.com/*"
  to = "https://peterdemirdjian.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.peterdemirdjian.com/*"
  to = "https://peterdemirdjian.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.peterdemirdjian.com/*"
  to = "https://peterdemirdjian.com/:splat"
  status = 301
  force = true

# Redirect legacy .html URLs to Hugo clean URLs
[[redirects]]
  from = "/resume.html"
  to = "/resume/"
  status = 301
  force = true

[[redirects]]
  from = "/license.html"
  to = "/license/"
  status = 301
  force = true

# Security redirects - block access to sensitive files
[[redirects]]
  from = "/.env*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/.git/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
